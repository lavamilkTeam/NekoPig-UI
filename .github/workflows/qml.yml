name: QML Components

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        scale: ['1', '1.5', '2']
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      QT_SCALE_FACTOR: ${{ matrix.scale }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install Qt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0
          python -m pip install -r requirements-dev.txt
      - name: Check module boundaries
        run: python tools/check_boundaries.py
      - name: Check QML
        run: pyside6-qmllint -I qml qml/NekoPigUI/*.qml gallery/Main.qml tests/Controls.qml
      - name: Check public controls and gallery
        run: python -m unittest discover -s tests -v
      - name: Upload gallery previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gallery-previews-${{ matrix.scale }}
          path: build/previews/*.png
          if-no-files-found: error
